services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/student
      JWT_ACCESS_SECRET: change-me
      JWT_REFRESH_SECRET: change-me-too
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    volumes:
      - .:/app
    ports:
      - "4000:4000"
    depends_on:
      - db

  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
